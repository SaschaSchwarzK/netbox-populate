# Config contexts with every assignment relation. "tags" is a plain list of slugs here.
endpoint: extras/config-contexts
plain_tags: true
objects:
  - name: Death Star Operations Context
    weight: 100
    profile: "@extras/config-context-profiles?name=Death Star Operations"
    description: Applies to the Empire's flagship facilities
    is_active: true
    regions: ["@dcim/regions?slug=outer-rim"]
    site_groups: ["@dcim/site-groups?slug=space-stations"]
    sites: ["@dcim/sites?slug=death-star-ii"]
    locations: ["@dcim/locations?slug=reactor-core-room"]
    device_types: ["@dcim/device-types?slug=nexus-6-core-switch"]
    roles: ["@dcim/device-roles?slug=transporter-switches"]
    platforms: ["@dcim/platforms?slug=replicant-os-6"]
    tenant_groups: ["@tenancy/tenant-groups?slug=galaxy-far-far-away"]
    tenants: ["@tenancy/tenants?slug=galactic-empire"]
    tags: [pied-piper]
    owner: "@users/owners?name=Lucius Fox"
    data: {reactor_core: kyber, exhaust_port_diameter_m: 2, thermal_exhaust_port_protected: false}
  - name: Hogwarts Cluster Context
    weight: 500
    is_active: true
    cluster_types: ["@virtualization/cluster-types?slug=pensieve-cluster"]
    cluster_groups: ["@virtualization/cluster-groups?slug=hogwarts-compute"]
    clusters: ["@virtualization/clusters?name=Pensieve-North"]
    tenants: ["@tenancy/tenants?slug=hogwarts-school"]
    data: {dns: {servers: [198.18.1.7], search: [hogwarts.example.com]}, motd: "Mischief managed"}
  - name: Disabled Legacy Context
    weight: 1000
    is_active: false
    description: Inactive context kept for reference
    data: {legacy: true}
